{% extends "layout/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="dashboard-shell">
    <section class="page-hero">
        <div>
            <span class="eyebrow">En construcción</span>
            <h2>{{ titulo }}</h2>
            <p>Este módulo todavía no está disponible. Mientras tanto puedes generar reportes de mantenimiento y consultar el historial.</p>

        <div class="hero-actions">

        </div>
    </section>
</div>
{% endblock %}
