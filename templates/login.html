<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo_biomega.ico') }}" type="image/x-icon">
    <title>Iniciar sesión · SISEM</title>
</head>
<body>
    <div class="container">
        <div class="izquierda">
            <div class="formulario">
                <h2>Inicio de sesión</h2>
                {% if error %}
                    <div class="error" role="alert">
                        <p>{{ error }}</p>
                    </div>
                {% endif %}
                <form action="{{ url_for('login') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="text" name="username" placeholder="Usuario" autocomplete="username" required autofocus>
                    <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                    <button type="submit">Iniciar sesión</button>
                </form>
            </div>
        </div>
        <div class="derecha">
            <h1>SISEM</h1>
            <p>Sistema Integrado de Seguimiento de Equipos Médicos</p>
        </div>
    </div>

    <footer>
        <p>&copy; BIOMEGA - INGENIERIA Y MANTENIMIENTO - 2026 SISEM. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
