# Blueprint opcional para Render (https://render.com). Los valores "sync: false" se
# escriben en el panel de Render, no en este archivo.
services:
  - type: web
    name: sisem
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sisem-db
          property: connectionString

databases:
  - name: sisem-db
    plan: free          # el plan gratis expira a los 30 días y no tiene backups: solo para pruebas
